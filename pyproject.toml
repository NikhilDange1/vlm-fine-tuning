[project]
name = "vlm-qlora-starter"
version = "0.1.0"
description = "Starter project for QLoRA fine-tuning of Hugging Face VLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.34.0",
  "bitsandbytes>=0.43.1",
  "datasets>=2.20.0",
  "peft>=0.12.0",
  "pillow>=10.4.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
]

[project.scripts]
train-vlm-qlora = "scripts.train_qlora_vlm:main"
eval-grounding-vlm = "scripts.evaluate_grounding_vlm:main"
jsonl-to-yolo = "scripts.jsonl_to_yolo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
