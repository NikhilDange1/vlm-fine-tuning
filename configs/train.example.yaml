model:
  model_id: "Qwen/Qwen2.5-VL-3B-Instruct"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
  input_width: 896
  input_height: 896

data:
  train_data: "data/sample_train.jsonl"
  eval_data: ""
  image_root: "."

training:
  output_dir: "outputs/qwen2_5_vl_qlora"
  max_steps: 750
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  logging_steps: 5
  save_steps: 50
  save_total_limit: 4
  bf16: true
  remove_unused_columns: false

evaluation:
  eval_every_steps: 50
  eval_subset_size: 10
  final_eval_subset_size: 0
  eval_progress_every: 10
  eval_iou_threshold: 0.5
  eval_max_new_tokens: 1024
  run_final_eval: false

logging:
  log_level: "INFO"
  log_file: null
  tensorboard_dir: null
